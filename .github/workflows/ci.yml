name: CI

on:
  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://command_center:command_center_ci@localhost:5432/command_center_test?schema=public
  TEST_DATABASE_URL: postgresql://command_center:command_center_ci@localhost:5432/command_center_test?schema=public

  REDIS_URL: redis://localhost:6379
  TEST_REDIS_URL: redis://localhost:6379/1

  JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
  JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long

  FRONTEND_URL: http://localhost:3000
  CORS_ORIGINS: http://localhost:3000

  INVITATION_TOKEN_PEPPER: ci-invitation-pepper-at-least-32-characters

  WEBHOOK_ENCRYPTION_KEY: x+nJDMsbP6mMzpkd3iZYgPP7GdoE2K1kp9m/jafq6Uo=

  COOKIE_NAME: command_center_refresh_token
  COOKIE_SECURE: 'false'
  COOKIE_SAME_SITE: lax

  ANALYTICS_SCHEDULER_ENABLED: 'false'
  ANALYTICS_WORKER_ENABLED: 'false'
  HEALTH_MONITOR_ENABLED: 'false'
  WEBHOOK_WORKER_ENABLED: 'false'
  WEBHOOK_CLEANUP_ENABLED: 'false'
  NOTIFICATION_CLEANUP_ENABLED: 'false'

jobs:
  # ======================================================
  # FORMAT
  # ======================================================

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  # ======================================================
  # LINT
  # ======================================================

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build:packages

      - name: Generate Prisma Client
        run: pnpm --filter @command-center/api exec prisma generate

      - name: Lint
        run: pnpm lint

  # ======================================================
  # TYPECHECK
  # ======================================================

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @command-center/api exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

  # ======================================================
  # BUILD
  # ======================================================

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @command-center/api exec prisma generate

      - name: Build
        run: pnpm build

  # ======================================================
  # REQUIRED MAIN-BRANCH GATE
  # ======================================================

  quality:
    name: Quality & Tests
    runs-on: ubuntu-latest

    needs:
      - format
      - lint
      - typecheck
      - build

    if: always()

    steps:
      - name: Write job summary
        run: |
          {
            echo "## CI Summary"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Format | ${{ needs.format.result == 'success' && '✅ pass' || needs.format.result == 'skipped' && '⏩ skipped' || '❌ fail' }} |"
            echo "| Lint | ${{ needs.lint.result == 'success' && '✅ pass' || needs.lint.result == 'skipped' && '⏩ skipped' || '❌ fail' }} |"
            echo "| Typecheck | ${{ needs.typecheck.result == 'success' && '✅ pass' || needs.typecheck.result == 'skipped' && '⏩ skipped' || '❌ fail' }} |"
            echo "| Build | ${{ needs.build.result == 'success' && '✅ pass' || needs.build.result == 'skipped' && '⏩ skipped' || '❌ fail' }} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify all CI jobs passed
        run: |
          failed=0

          declare -A results=(
            [Format]="${{ needs.format.result }}"
            [Lint]="${{ needs.lint.result }}"
            [Typecheck]="${{ needs.typecheck.result }}"
            [Build]="${{ needs.build.result }}"
          )

          for name in "${!results[@]}"; do
            if [[ "${results[$name]}" != "success" ]]; then
              echo "$name failed (${results[$name]})"
              failed=1
            fi
          done

          if [[ "$failed" -eq 1 ]]; then
            exit 1
          fi

          echo "All CI checks passed"
