      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="170" fill="#010714"/>

  <g filter="url(#outerGlow)">
    <rect x="60" y="60" width="904" height="904" rx="165" fill="url(#bgGrad)"/>
    <rect x="60" y="60" width="904" height="904" rx="165" stroke="url(#ringGrad)" stroke-width="8"/>
  </g>

