<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="140" y1="120" x2="900" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06173A"/>
      <stop offset="0.6" stop-color="#031238"/>
      <stop offset="1" stop-color="#24105F"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="120" y1="140" x2="880" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67A8FF"/>
