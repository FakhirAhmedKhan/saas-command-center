name: command-center-fullstack-e2e

services:
  postgres-fullstack-e2e:
    image: postgres:16-alpine
    container_name: command-center-fullstack-e2e-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: command_center_full_e2e
      POSTGRES_PASSWORD: command_center_full_e2e
      POSTGRES_DB: command_center_full_e2e
    ports:
      - "5435:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U command_center_full_e2e -d command_center_full_e2e
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - command_center_fullstack_e2e_data:/var/lib/postgresql/data

volumes:
  command_center_fullstack_e2e_data:
