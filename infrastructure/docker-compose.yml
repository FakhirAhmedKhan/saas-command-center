name: saas-command-center

services:
  postgres:
    image: postgres:17-alpine
    container_name: command-center-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: command_center
      POSTGRES_PASSWORD: command_center_dev
      POSTGRES_DB: command_center
    ports:
      - '55432:5432'
    volumes:
      - command_center_postgres_data:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U command_center -d command_center']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  command_center_postgres_data:
