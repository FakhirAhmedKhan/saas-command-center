packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/test-code/*'

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false

nodeLinker: hoisted
sharedWorkspaceLockfile: true

overrides:
  'js-yaml@>=5.0.0 <=5.2.1': '5.2.3'
  'dompurify@<=3.4.12': '3.4.13'
